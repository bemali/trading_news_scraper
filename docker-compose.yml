services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: news
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  news_job:
    build: .
    command: ["python", "-m", "src.news_scrape"]
    depends_on:
      - postgres
    environment:
      NEWS_API_KEY: "${NEWS_API_KEY}"
      NEWS_API_CATEGORIES: "${NEWS_API_CATEGORIES}"
      NEWS_API_LIMIT: "${NEWS_API_LIMIT}"
      AZURE_OPENAI_ENDPOINT: "${AZURE_OPENAI_ENDPOINT}"
      AZURE_OPENAI_API_KEY: "${AZURE_OPENAI_API_KEY}"
      AZURE_OPENAI_DEPLOYMENT: "${AZURE_OPENAI_DEPLOYMENT}"
      AZURE_OPENAI_API_VERSION: "${AZURE_OPENAI_API_VERSION}"
      POSTGRES_CONN_STR: "postgresql://news:news@postgres:5432/news"
      POSTGRES_INIT_SCHEMA: "true"
    restart: "no"

volumes:
  pgdata:
