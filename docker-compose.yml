services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: news
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news"]
      interval: 5s
      timeout: 3s
      retries: 12

  news_job:
    build: .
    command: ["python", "-m", "src.pipeline"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NEWS_API_KEY: "${NEWS_API_KEY:-}"
      AZURE_OPENAI_API_KEY: "${AZURE_OPENAI_API_KEY:-}"
      POSTGRES_CONN_STR: "${POSTGRES_CONN_STR:-postgresql://news:news@postgres:5432/news}"
    restart: "no"

volumes:
  pgdata:
